<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle of the Board Live</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--k:#0a0a0a;--red:#e3121b;--w:#f2f2f2;--g:#8e8e8e;--line:#2e2e2e;--panel:#131313;--ink:var(--w);--mute:var(--g);--hand:var(--red)}
body{margin:0;color:var(--w);background:radial-gradient(circle,rgba(255,255,255,.055) 0 1px,transparent 1.6px) 0 0/7px 7px,var(--k)}
*{box-sizing:border-box}
html,body{height:100%}
body{font:700 16px/1.3 "Space Mono",ui-monospace,monospace;overflow:hidden;text-transform:uppercase}
#stage{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:2.4vh;padding:3vh 3vw}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:2vw;border-bottom:3px solid var(--w);padding-bottom:1.8vh}
.brand .logo{display:block;width:clamp(200px,25vw,460px);height:auto}
#connect h1 .logo{display:block;width:min(80vw,540px);height:auto;margin:0 auto}
.host:empty{display:none}
.host{margin-top:1.2vh;font-size:clamp(10px,.95vw,17px)}
.round{text-align:right}
.round .t{font:400 clamp(26px,3.4vw,64px)/1 Anton,Impact,sans-serif;letter-spacing:.01em}
.round .g{display:inline-block;margin-left:.8vw;padding:.1em .3em;background:var(--red);color:var(--k);transform:rotate(3deg);font:400 clamp(26px,3.4vw,64px)/1 Anton,Impact,sans-serif}
.round .s{color:var(--g);font-size:clamp(11px,1.1vw,20px);margin-top:1vh}
.main{display:grid;grid-template-columns:1.7fr 1fr;gap:2.4vw;min-height:0}
.now{position:relative;background:var(--panel);border:3px solid var(--w);border-left:0;padding:3vh 3vw 3vh calc(3vw + 1.4vw);display:flex;flex-direction:column;justify-content:center;min-width:0}
.now::before{content:'';position:absolute;left:0;top:-3px;bottom:-3px;width:1.4vw;background:var(--red)}
.lab{display:inline-block;align-self:flex-start;background:var(--red);color:var(--k);padding:.25em .7em;font-size:clamp(12px,1.25vw,22px);letter-spacing:.06em}
.who{font:400 clamp(52px,9vw,180px)/.95 Anton,Impact,sans-serif;margin:1.6vh 0 2.4vh;overflow-wrap:anywhere}
.hearts{font-size:clamp(56px,8.4vw,160px);line-height:.9;color:var(--red);letter-spacing:.08em;text-transform:none}
.hearts .e{color:#333}
.hearts .last{display:inline-block;transform-origin:50% 60%;animation:lastlife 1.3s ease-in-out infinite}
@keyframes lastlife{0%,100%{transform:translateX(0) rotate(0);color:var(--red)}8%{transform:translateX(-.08em) rotate(-8deg)}16%{transform:translateX(.08em) rotate(8deg)}24%{transform:translateX(-.06em) rotate(-6deg)}32%{transform:translateX(.06em) rotate(6deg)}40%{transform:translateX(0) rotate(0);color:var(--w)}50%{color:var(--red)}60%{color:var(--w)}70%{color:var(--red)}}
@keyframes lastlife-calm{0%,100%{color:var(--red)}50%{color:var(--w)}}
@media (prefers-reduced-motion:reduce){.last{animation:lastlife-calm 1.2s steps(1) infinite!important}}

.meta{display:flex;align-items:center;gap:2vw;flex-wrap:wrap;margin-top:2vh}
.pill{padding:.35em .8em;font-size:clamp(12px,1.35vw,24px);background:var(--w);color:var(--k);transform:rotate(-1.5deg)}
.pill.off{background:transparent;color:#5c5c5c;border:2px solid #333;text-decoration:line-through;transform:none}
.timer{font:400 clamp(30px,4vw,76px)/1 Anton,Impact,sans-serif;font-variant-numeric:tabular-nums;color:var(--red)}
.timer.idle{color:var(--g)}
.otm{margin:2.4vh 0 2.6vh;font:400 clamp(110px,16vw,320px)/.85 Anton,Impact,sans-serif;color:var(--w);font-variant-numeric:tabular-nums}
.otm.paused{color:var(--g)}
.otm.hot{color:var(--red)}
.ready{font-size:clamp(18px,2.3vw,44px);letter-spacing:.03em;line-height:1.25}
.ready b{color:var(--red);font:400 1.35em/1 Anton,Impact,sans-serif;letter-spacing:.01em}
.side{background:var(--panel);border:3px solid var(--line);padding:3vh 2vw;min-height:0;overflow:hidden}
.side h2{margin:0 0 1.6vh;display:inline-block;background:var(--w);color:var(--k);padding:.25em .7em;font-size:clamp(12px,1.25vw,22px);letter-spacing:.06em;font-weight:700}
.next{list-style:none;margin:0;padding:0}
.next li{display:flex;justify-content:space-between;align-items:center;gap:1vw;padding:1.1vh 0;border-bottom:1px solid var(--line);font-size:clamp(14px,1.7vw,32px)}
.next li .n{color:var(--g);width:2em;flex:none}
.next li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next li .h{color:var(--red);font-size:.8em;letter-spacing:.05em;flex:none}
.next li:first-child .nm{color:var(--red)}
footer{display:flex;gap:3vw;align-items:center;color:var(--g);font-size:clamp(11px,1.2vw,22px);min-height:3vh;padding-right:min(380px,34vw)}
footer b{color:var(--w)}
footer .chips{display:flex;gap:.6vw;flex-wrap:wrap;flex:1;min-width:0;overflow:hidden;max-height:4.6em}
footer .chip{border:2px solid var(--w);color:var(--w);padding:.1em .6em}
.center{grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.2vh}
.center .lab{align-self:center}
.big{font:400 clamp(60px,11vw,220px)/.9 Anton,Impact,sans-serif}
.order{list-style:none;display:grid;grid-auto-flow:column;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:3vw;text-align:left;font-size:clamp(12px,1.4vw,26px);margin:0;padding:0;width:min(92vw,1400px)}
.order li{padding:.3vh 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order li span{display:inline-block;width:2.4em;color:var(--red)}
.podium{display:flex;gap:3vw;align-items:flex-end;justify-content:center}
.podium div{text-align:center}
.podium .pl{display:inline-block;background:var(--w);color:var(--k);padding:.2em .6em;font-size:clamp(11px,1.3vw,24px)}
.podium .p1 .pl{background:var(--red)}
.podium .pn{font:400 clamp(30px,3.8vw,72px)/1 Anton,Impact,sans-serif;margin-top:.8vh}
.podium .p1 .pn{font-size:clamp(60px,9.5vw,190px);color:var(--red)}
.rest{list-style:none;margin:5vh 0 0;padding:0;columns:4;column-gap:3vw;text-align:left;font-size:clamp(12px,1.35vw,24px);max-width:90vw}
.rest li{padding:.4vh 0;break-inside:avoid;color:var(--w)}
.rest li span{display:inline-block;width:2.4em;color:var(--red)}
/* flash */
#flash{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:30;padding:4vw}
#flash.on{display:flex;opacity:1}
#flash.on.bye{opacity:0;transition:opacity .5s ease-in}
.fw{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1}
.fl{display:flex;align-items:flex-start}
.fl+.fl{margin-left:.8em;margin-top:-.04em}
.fw.row{flex-direction:row;gap:.3em}
.fw.row .fl+.fl{margin:0}
.g{display:block;height:1em;flex:none;background:currentColor;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.fsp{display:block;width:.25em;flex:none}
#flash .fn{font:400 clamp(40px,6.5vw,130px)/1 Anton,Impact,sans-serif;margin-bottom:4vh;overflow-wrap:anywhere}
#flash .fs{font-size:clamp(16px,2.2vw,42px);margin-top:4vh;letter-spacing:.04em}
#flash.sent{background:radial-gradient(circle,rgba(0,0,0,.1) 0 1px,transparent 1.6px) 0 0/7px 7px,#2fcf8a;color:#062316}
#flash.fell{background:radial-gradient(circle,rgba(0,0,0,.12) 0 1px,transparent 1.6px) 0 0/7px 7px,var(--red);color:var(--k)}
#flash.out{background:radial-gradient(circle,rgba(227,18,27,.25) 0 1.2px,transparent 1.8px) 0 0/7px 7px,var(--k);color:var(--w)}
#flash.out .fs{color:var(--red)}
#flash.skip{background:radial-gradient(circle,rgba(0,0,0,.1) 0 1px,transparent 1.6px) 0 0/7px 7px,#ffb43c;color:#2b1a02}
/* round popup */
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,255,255,.055) 0 1px,transparent 1.6px) 0 0/7px 7px,var(--k);z-index:20;padding:3vh 2.5vw}
#pop h1{margin-bottom:3.4vh!important}
#card{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4vh;z-index:25;padding:4vw;background:radial-gradient(circle,rgba(227,18,27,.22) 0 1.2px,transparent 1.8px) 0 0/7px 7px,var(--k)}
#card.on{display:flex;opacity:1}
#card.on.bye{opacity:0;transition:opacity .6s ease-in}
#card .cs{font-size:clamp(18px,2.6vw,50px);letter-spacing:.06em;color:var(--w)}
#pop.on{display:flex}
#pop .box{background:var(--k);border:4px solid var(--w);box-shadow:1.2vw 1.2vw 0 var(--red);padding:3.5vh 3vw;max-height:92vh;overflow:hidden;width:min(1800px,95vw)}
#pop h1{margin:0;font:400 clamp(44px,6.5vw,128px)/.95 Anton,Impact,sans-serif}
#pop p{font-size:clamp(12px,1.5vw,28px);color:var(--g);margin:2vh 0 3.4vh;letter-spacing:.02em}
#pop .cols{display:grid;gap:2.4vw}
#pop .cols>div{min-width:0}
#pop ul.notes{list-style:none;margin:0 0 3.4vh;padding:0;font-size:clamp(15px,1.75vw,32px);line-height:1.35}
#pop ul.notes li{padding:.5vh 0 .5vh 1.4em;position:relative}
#pop ul.notes li::before{content:'';position:absolute;left:0;top:.55em;width:.55em;height:.55em;background:var(--red)}
#pop h3{margin:0 0 1.6vh;display:inline-block;background:var(--red);color:var(--k);padding:.25em .7em;font-size:clamp(12px,1.35vw,24px);letter-spacing:.05em}
#pop ol{margin:0;padding-left:1.9em;font-size:clamp(13px,1.45vw,27px)}
#pop .cols.n3 ol{font-size:clamp(12px,1.3vw,25px)}
#pop .cols.n4 ol{font-size:clamp(11px,1.12vw,22px)}
#pop .cols.n3 h3,#pop .cols.n4 h3{font-size:clamp(11px,1.1vw,21px)}
#pop ol.two{columns:2;column-gap:2.5vw}
#pop ol li{break-inside:avoid;padding:.2vh 0 .8vh;overflow-wrap:break-word;word-break:normal;hyphens:none}
#pop ol li .ps{display:block;font-size:.66em;color:var(--g)}
#pop ol li .pp{display:block;font-size:.7em;color:var(--red)}
/* connect + status */
#connect{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,255,255,.055) 0 1px,transparent 1.6px) 0 0/7px 7px,var(--k);z-index:40;padding:24px}
#connect.on{display:flex}
#connect form{text-align:center;max-width:600px;width:100%}
#connect h1{margin:0 0 22px;font-size:clamp(30px,4.2vw,60px)}
#connect p{color:var(--g);font-size:15px;margin:18px 0 24px}
#connect input{width:100%;font:400 72px Anton,Impact,sans-serif;letter-spacing:.3em;text-align:center;text-transform:uppercase;background:var(--k);color:var(--w);border:3px solid var(--w);border-radius:0;padding:10px 0 10px .3em}
#connect button{margin-top:18px;width:100%;font:700 20px "Space Mono",monospace;text-transform:uppercase;background:var(--red);color:var(--k);border:0;border-radius:0;padding:16px;cursor:pointer}
input:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
#sndhint{position:fixed;left:14px;bottom:12px;z-index:36;display:none;font:700 12px "Space Mono",monospace;text-transform:uppercase;letter-spacing:.04em;background:var(--red);color:var(--k);padding:8px 12px}
#sndhint.on{display:block}
#bar{position:fixed;right:14px;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:12px;color:var(--g);z-index:35}
#bartog{display:flex;align-items:center;gap:7px;font:700 14px/1 "Space Mono",monospace;background:var(--k);color:var(--w);border:1px solid #333;border-radius:0;padding:7px 9px;cursor:pointer;opacity:.35;transition:opacity .2s}
#bartog:hover,#bartog:focus-visible,#bartog[aria-expanded="true"]{opacity:1}
#barpanel{display:flex;flex-direction:column;gap:8px;width:300px;max-width:calc(100vw - 28px);background:var(--k);border:2px solid var(--w);box-shadow:6px 6px 0 var(--red);padding:12px}
#barpanel[hidden]{display:none}
#barpanel .bst{display:flex;gap:8px;align-items:center;color:var(--w);font-size:12px;line-height:1.3;padding-bottom:4px}
#barpanel .mb,#barpanel button{font:700 11px "Space Mono",monospace;text-transform:uppercase;background:var(--k);color:var(--w);border:1px solid #444;border-radius:0;padding:8px 10px;cursor:pointer;text-decoration:none;text-align:left}
#barpanel .mb:hover,#barpanel button:hover{border-color:var(--w)}
.dot{width:10px;height:10px;display:inline-block;flex:none;background:var(--red)}
.dot.live{background:#3ddc84}
#bigst{max-width:70vw;background:transparent;color:var(--g);letter-spacing:.02em}

.ransom{display:inline-flex;flex-direction:column;gap:.06em;font-family:Anton,Impact,sans-serif;font-weight:400;line-height:1;text-transform:uppercase}
.rl{display:flex;gap:.04em;flex-wrap:nowrap}
.rl+.rl{margin-left:.7em}
.rt{display:inline-block;padding:.04em .09em .01em;transform:rotate(var(--r)) translateY(var(--y,0));position:relative;color:var(--k);border:.05em solid var(--k);overflow:hidden}
.rt.red{background:var(--red)}
.rt.wht{background:var(--w)}
.rt.blk{background:var(--k);color:var(--w);border-color:var(--w)}
.rt::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(0,0,0,.6) 30%,transparent 34%) 0 0/.13em .13em;-webkit-mask-image:linear-gradient(130deg,transparent 35%,#000 95%);mask-image:linear-gradient(130deg,transparent 35%,#000 95%)}
.rt.blk::after{background:radial-gradient(circle,rgba(255,255,255,.35) 30%,transparent 34%) 0 0/.13em .13em}
.sp{display:inline-block;width:.28em}
.bar{display:inline-block;line-height:1.35;background:var(--red);color:var(--k);font:700 1em/1.2 "Space Mono",monospace;text-transform:uppercase;letter-spacing:.04em;padding:.2em .6em}
.bar em{font-style:normal;color:var(--w)}

</style>
<script src="vendor/mqtt.min.js"></script>
</head>
<body>
<main id="stage"></main>
<div id="pop" role="dialog" aria-live="polite"></div>
<div id="card" aria-live="polite"></div>
<div id="flash" aria-live="assertive"></div>
<div id="connect">
  <form id="cf">
    <h1 id="ch"></h1>
    <p>Enter the 4-character display code shown at the top of the tracker on the Tracker Device.</p>
    <label for="ci" style="position:absolute;left:-9999px">Display code</label>
    <input id="ci" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button type="submit">Connect display</button>
  </form>
</div>
<div id="sndhint">Click anywhere to turn on sound</div>
<div id="bar"><div id="barpanel" hidden><div class="bst"><span class="dot" id="dot"></span><span id="st">Not connected</span></div><button id="chg">Change code</button><button id="fs">Full screen</button><button id="snd">Sound: on</button><button id="sndtest">Test elimination sound</button><button id="sndround">Test round sound</button><button id="sndfall">Test fall sound</button><button id="sndsend">Test send sound</button><button id="sndskip">Test skip sound</button><a class="mb" href="./">Menu</a></div><button id="bartog" aria-expanded="false" aria-controls="barpanel" aria-label="Connection and settings"><span class="dot" id="dot2"></span>&#8943;</button></div>
<script>
var cardKey='',firstState=true,code=null,clients=[],gotState=false,lastSent=0,last=null,seen=0,first=true,flashUntil=0,tEnd=0,obs={st:'done',left:0},retry=null,flashT=null;
try{code=localStorage.getItem('botb-display-code')}catch(e){}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ransom(lines){var rot=[-4,3,-2,5,-3,2,-5,4,-1,3,-3,2],yy=[0,-.04,.03,-.02,.05,0,-.05,.02],k=0;return '<span class="ransom" aria-label="'+lines.map(function(l){return l.w}).join(' ')+'">'+lines.map(function(l){return '<span class="rl" aria-hidden="true">'+l.w.split('').map(function(ch){if(ch===' ')return '<span class="sp"></span>';var i=k++;return '<span class="rt '+l.c+'" style="--r:'+rot[i%rot.length]+'deg;--y:'+yy[i%yy.length]+'em">'+esc(ch)+'</span>'}).join('')+'</span>'}).join('')+'</span>'}
function brandTitle(){return '<img class="logo" src="logo-v2.png" alt="Battle of the Board">'}
var SUBBAR='';
function status(t,live){$('st').textContent=t;$('dot').className=$('dot2').className='dot'+(live?' live':'');var b=$('bigst');if(b)b.textContent=t}

/* ---------- link ---------- */
var BROKERS=[{u:'wss://public.cloud.shiftr.io',o:{username:'public',password:'public'}},{u:'wss://broker.emqx.io:8084/mqtt'},{u:'wss://broker.hivemq.com:8884/mqtt'}];
(function(){var b=null;try{b=new URLSearchParams(location.search).get('broker')}catch(e){}if(b)BROKERS=[{u:b}]})();
function topic(x){return 'rockrevolution/botb/v1/'+code+'/'+x}
function upd(){
  var n=clients.filter(function(c){return c.connected}).length;
  if(!window.mqtt)status('Link library failed to load. Check the internet connection and reload.');
  else if(!n)status('Connecting to the message server');
  else if(!gotState)status('Connected. Waiting for the Tracker Device with code '+code+'. Check the code and that the tracker page is open.');
  else status('Live, code '+code,true);
}
function connect(){
  clients.forEach(function(c){try{c.end(true)}catch(e){}});clients=[];gotState=false;lastSent=0;last=null;tEnd=0;render();
  if(!code){showConnect();return}
  if(!window.mqtt){upd();return}
  BROKERS.forEach(function(b){
    var o=Object.assign({clientId:'botbD'+Math.random().toString(16).slice(2,10),reconnectPeriod:3000,connectTimeout:8000,clean:true,keepalive:30},b.o||{});
    var c;try{c=mqtt.connect(b.u,o)}catch(e){return}
    clients.push(c);
    c.on('connect',function(){c.subscribe(topic('state'));try{c.publish(topic('hello'),'join')}catch(e){}upd()});
    c.on('message',function(t,m){var d;try{d=JSON.parse(String(m))}catch(e){return}onData(d)});
    c.on('close',upd);c.on('offline',upd);c.on('error',function(){});
  });
  upd();
}
setInterval(function(){clients.forEach(function(c){if(c.connected)try{c.publish(topic('hello'),'ping')}catch(e){}});upd()},5000);
function onData(m){
  if(!m||m.type!=='state'||!(m.sentAt>lastSent))return;
  lastSent=m.sentAt;gotState=true;
  var s=m.s;
  if(s.flash&&s.flash.t>seen){if(!first)doFlash(s.flash);seen=s.flash.t}
  first=false;
  obs=m.timer&&m.timer.st?m.timer:{st:'done',left:0};
  tEnd=obs.st==='running'?Date.now()+Math.min(obs.ms!=null?obs.ms:obs.left*1000,(obs.full||9999)*1000):0;
  var ckey=s.phase+':'+s.round+':'+s.sdRound;
  if(firstState||!last)cardKey=ckey;
  else if((s.phase==='round'||s.phase==='sd')&&ckey!==cardKey&&((last.popup&&!s.popup)||(last.phase==='setup'&&s.phase==='round'))){cardKey=ckey;showCard(s)}
  firstState=false;
  last=s;render();upd();
}
function showConnect(){$('ch').innerHTML=brandTitle();$('connect').className='on';$('ci').value=code||'';setTimeout(function(){$('ci').focus()},50)}
$('cf').addEventListener('submit',function(e){e.preventDefault();var v=$('ci').value.trim().toUpperCase();if(v.length!==4)return;code=v;try{localStorage.setItem('botb-display-code',v)}catch(x){}$('connect').className='';first=true;connect()});
$('chg').addEventListener('click',function(){barOpen(false);showConnect()});
function barOpen(o){$('barpanel').hidden=!o;$('bartog').setAttribute('aria-expanded',o?'true':'false')}
$('bartog').addEventListener('click',function(e){e.stopPropagation();barOpen($('barpanel').hidden)});
document.addEventListener('click',function(e){if(!$('bar').contains(e.target))barOpen(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')barOpen(false)});
$('fs').addEventListener('click',function(){var d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen()});

/* ---------- elimination sounds ---------- */
var SFX=["ack", "bonk", "bruh", "explosion", "fail", "fail-trumpet", "gunshot", "huh-cat", "lego-die", "mystery", "oof", "punch", "punch-hd", "snake", "vine-boom", "wasted", "wilhelm", "yoda"],sfxOn=true,lastSfx=null,sfx={};
try{sfxOn=localStorage.getItem('botb-sound')!=='off'}catch(e){}
var SV='?v=14',AC=null,BUF={};
try{var ACtor=window.AudioContext||window.webkitAudioContext;if(ACtor)AC=new ACtor({latencyHint:'interactive'})}catch(e){}
function loadSnd(key,url){
  if(!AC){var a=new Audio(url);a.preload='auto';BUF[key]=a;return}
  fetch(url).then(function(r){return r.arrayBuffer()}).then(function(ab){return new Promise(function(ok,no){AC.decodeAudioData(ab,ok,no)})}).then(function(b){BUF[key]=b}).catch(function(){var a=new Audio(url);a.preload='auto';BUF[key]=a});
}
SFX.forEach(function(n){loadSnd(n,'sounds/elim/'+n+'.mp3'+SV)});
loadSnd('round','sounds/round.mp3'+SV);
loadSnd('fall','sounds/fall.mp3'+SV);
loadSnd('send','sounds/send.mp3'+SV);
loadSnd('skip','sounds/skip.mp3'+SV);
loadSnd('tick1','sounds/tick1.mp3'+SV);loadSnd('tick2','sounds/tick2.mp3'+SV);
/* observation countdown ticking: one tick per second, alternating samples, scheduled on the audio clock */
var tickSched={},tickEnd=0;
function cancelTicks(){Object.keys(tickSched).forEach(function(k){try{tickSched[k].stop()}catch(e){}});tickSched={}}
function tickLoop(){
  if(!AC||!sfxOn||obs.st!=='running'||!tEnd||!(BUF.tick1 instanceof AudioBuffer)||!(BUF.tick2 instanceof AudioBuffer)){if(Object.keys(tickSched).length)cancelTicks();tickEnd=0;return}
  if(tickEnd!==tEnd&&Math.abs(tickEnd-tEnd)>150){cancelTicks();tickEnd=tEnd}
  if(AC.state!=='running')return;
  var now=Date.now(),lat=((AC.baseLatency||0)+(AC.outputLatency||0))*1000,top=Math.ceil((tEnd-now)/1000)-1;
  for(var n=top;n>=1&&n>=top-1;n--){
    if(tickSched[n])continue;var dt=(tEnd-n*1000-now-lat)/1000;if(dt<-0.02||dt>0.4)continue;if(dt<0)dt=0;
    var src=AC.createBufferSource();src.buffer=BUF[n%2?'tick2':'tick1'];src.connect(AC.destination);src.start(AC.currentTime+dt);tickSched[n]=src;
  }
}
setInterval(tickLoop,100);
function playSkip(force){if(!sfxOn&&!force)return;playKey('skip')}
function playSend(force){if(!sfxOn&&!force)return;playKey('send')}
function playFall(force){if(!sfxOn&&!force)return;playKey('fall')}
function playKey(key){
  var b=BUF[key];if(!b)return;
  if(b instanceof HTMLMediaElement){try{b.pause();b.currentTime=0}catch(e){}var p=b.play();if(p&&p.catch)p.catch(function(){sndHint(true)});return}
  if(AC.state!=='running'){AC.resume().catch(function(){});if(AC.state!=='running'){sndHint(true)}}
  var src=AC.createBufferSource();src.buffer=b;src.connect(AC.destination);src.start(0);
}
function playRound(force){if(!sfxOn&&!force)return;playKey('round')}
function sndHint(show){var h=$('sndhint');if(h)h.className=show&&sfxOn?'on':''}
function sndLabel(){$('snd').textContent='Sound: '+(sfxOn?'on':'off')}
function playElim(force){
  if(!sfxOn&&!force)return;
  var pool=SFX.filter(function(n){return n!==lastSfx}),n=pool[Math.floor(Math.random()*pool.length)];lastSfx=n;
  playKey(n);
}
function unlock(){sndHint(false);if(AC&&AC.state!=='running')AC.resume().catch(function(){})}
document.addEventListener('pointerdown',unlock,{passive:true});
document.addEventListener('keydown',unlock);

$('snd').addEventListener('click',function(){sfxOn=!sfxOn;try{localStorage.setItem('botb-sound',sfxOn?'on':'off')}catch(e){}sndLabel();if(!sfxOn)sndHint(false)});
$('sndtest').addEventListener('click',function(){playElim(true)});
$('sndround').addEventListener('click',function(){playRound(true)});

function gname(ch){return ch==='!'?'excl':ch}
function lineAdv(t){var a=0;t.split('').forEach(function(ch){a+=ch===' '?.25:(GM[ch]?GM[ch][1]:.5)});return a}
function fword(lines,row){return '<span class="fw'+(row?' row':'')+'" role="img" aria-label="'+esc(lines.map(function(l){return l.w}).join(' '))+'">'+lines.map(function(l){return '<span class="fl" style="color:'+l.c+'">'+l.w.toUpperCase().split('').map(function(ch){if(ch===' ')return '<span class="fsp"></span>';var m=GM[ch];if(!m)return '';var u='url(letters/'+gname(ch)+'.svg)';return '<span class="g" style="width:'+m[0]+'em;margin-left:'+(-m[2]).toFixed(3)+'em;margin-right:'+(m[1]-m[0]+m[2]).toFixed(3)+'em;-webkit-mask-image:'+u+';mask-image:'+u+'"></span>'}).join('')+'</span>'}).join('')+'</span>'}
function fsize(lines,maxVw,maxVh,row){var w=row?lines.reduce(function(a,l){return a+lineAdv(l.w.toUpperCase())+.3},-.3):Math.max.apply(null,lines.map(function(l){return lineAdv(l.w.toUpperCase())+(l===lines[1]?.8:0)}));return 'min('+(Math.min(maxVw,86/w)).toFixed(2)+'vw,'+(maxVh/(row?1:lines.length)).toFixed(1)+'vh)'}
var NUMW=['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],TENW=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function numWord(n){if(n<20)return NUMW[n];if(n<100)return TENW[Math.floor(n/10)]+(n%10?' '+NUMW[n%10]:'');return String(n)}
Object.keys(GM).forEach(function(ch){var i=new Image();i.src='letters/'+gname(ch)+'.svg'});
function doFlash(f){
  var el=$('flash'),word,sub='';
  if(f.k==='sent'){word='SENT!';playSend();sub='Stand by for the next boulder'}
  else if(f.k==='skip'){word='SKIP';playSkip();sub='Live to climb another day'}
  else if(f.k==='out'){word='ELIMINATED';playElim()}
  else{word='FELL';playFall();sub=f.lives+(f.lives===1?' life':' lives')+' left, back of the line'}
  el.className='';void el.offsetWidth;
  var tc=f.k==='out'?'var(--red)':f.k==='fell'?'var(--w)':'var(--k)',wl=[{w:word,c:tc}];
  el.innerHTML='<div class="fn">'+esc(f.name)+'</div><div class="word" style="font-size:'+fsize(wl,22,40)+'">'+fword(wl)+'</div>'+(sub?'<div class="fs">'+esc(sub)+'</div>':'');
  el.className='on '+(f.k==='skip'?'skip':f.k);
  flashUntil=Date.now()+2600;
  clearTimeout(flashT);clearTimeout(el._bye);el._bye=setTimeout(function(){el.classList.add('bye')},2100);flashT=setTimeout(function(){el.className='';render()},2600);
  render();
}

/* ---------- render ---------- */
function P(id){return last.players.filter(function(p){return p.id===id})[0]}
function hearts(n){n=Math.max(n,0);return '<span class="f'+(n===1?' last':'')+'">'+'♥'.repeat(n)+'</span><span class="e">'+'♥'.repeat(Math.max(((last&&last.startLives)||3)-n,0))+'</span>'}
function alive(){return last.players.filter(function(p){return !p.out})}
function head(){
  var s=last,t='',gr='',sub='';
  if(s.phase==='setup'){t=''}
  else if(s.phase==='round'){t='Round '+s.round+' of '+s.total;sub=alive().length+' climbers still in'}
  else if(s.phase==='sd'){t='Sudden Death, round '+s.sdRound;gr='<span class="g sd">'+s.angle+'°</span>';sub=alive().length+' climbers still in, no skips'}
  else{t='Final results'}
  return '<header><div><div class="brand">'+brandTitle()+'</div><div class="host">'+SUBBAR+'</div></div><div class="round"><div class="t">'+t+gr+'</div>'+(sub?'<div class="s">'+sub+'</div>':'')+'</div></header>';
}
function render(){
  var st=$('stage');
  if(!last){
    st.innerHTML='<header><div><div class="brand">'+brandTitle()+'</div><div class="host">'+SUBBAR+'</div></div></header><div class="center"><div class="big">Stand by</div><div class="lab">Waiting for the Tracker Device</div><div class="lab" id="bigst">'+esc($('st').textContent)+'</div></div><footer></footer>';
    $('pop').className='';return;
  }
  var s=last,h=head();
  if(s.phase==='setup'){
    h+='<div class="center"><div class="big">Starting soon</div>';
    var nl=s.players.length?s.players.map(function(p){return p.name}):(s.names||[]);
    if(nl.length)h+='<div class="lab">'+nl.length+(nl.length===1?' climber':' climbers')+'</div><ol class="order" style="grid-template-rows:repeat('+Math.ceil(nl.length/4)+',auto)">'+nl.map(function(n,i){return '<li><span>'+(i+1)+'</span>'+esc(n)+'</li>'}).join('')+'</ol>';
    h+='</div><footer></footer>';
  }else if(s.phase==='done'){
    var by={};s.players.forEach(function(p){by[p.place]=p});
    function pd(n,c){var p=by[n];return p?'<div class="'+c+'"><div class="pl">'+(n===1?'Champion':n===2?'2nd place':'3rd place')+'</div><div class="pn">'+esc(p.name)+'</div></div>':''}
    var rest=s.players.filter(function(p){return p.place>3}).sort(function(a,b){return a.place-b.place});
    h+='<div class="center"><div class="podium">'+pd(2,'p2')+pd(1,'p1')+pd(3,'p3')+'</div>'+(rest.length?'<ol class="rest">'+rest.map(function(p){return '<li><span>'+p.place+'</span>'+esc(p.name)+'</li>'}).join('')+'</ol>':'')+'</div><footer>'+s.players.length+' climbers competed</footer>';
  }else{
    var cur=P(s.queue[0]),sd=s.phase==='sd',observing=!!cur&&obs.st!=='done';
    h+='<div class="main"><section class="now">';
    if(observing){
      h+='<div class="lab" id="ost"></div><div class="otm" id="otm"></div><div class="ready">Get ready, <b>'+esc(cur.name)+'</b>, you\'re up first</div>';
    }else if(cur){
      h+='<div class="lab">Now climbing</div><div class="who">'+esc(cur.name)+'</div><div class="hearts" aria-label="'+cur.lives+' lives">'+hearts(cur.lives)+'</div><div class="meta">';
      if(!sd)h+='<span class="pill'+(cur.mull?'':' off')+'">'+(cur.mull?'Skip available':'Skip used')+'</span>';
      if(!observing)h+='<span class="timer" id="tm"></span>';
      h+='</div>';
    }else h+='<div class="lab">Between turns</div><div class="who">Stand by</div>';
    var off=observing?0:1;
    h+='</section><section class="side"><h2>'+'Up next'+'</h2><ul class="next">';
    var nx=s.queue.slice(off,off+8);
    if(!nx.length)h+='<li><span class="nm" style="color:var(--mute)">No one else in line</span></li>';
    nx.forEach(function(id,i){var p=P(id);h+='<li><span class="n">'+(i+1)+'</span><span class="nm">'+esc(p.name)+'</span><span class="h">'+'♥'.repeat(Math.max(p.lives,0))+'</span></li>'});
    if(s.queue.length>off+8)h+='<li><span class="nm" style="color:var(--mute)">+'+(s.queue.length-off-8)+' more</span></li>';
    h+='</ul></section></div>';
    var out=s.players.filter(function(p){return p.out}).length;
    h+='<footer><span>Sent <b>'+s.sent.length+'</b></span><div class="chips">'+s.sent.map(function(id){return '<span class="chip">'+esc(P(id).name)+'</span>'}).join('')+'</div><span>Eliminated <b>'+out+'</b></span></footer>';
  }
  st.innerHTML=h;tick();
  var pop=$('pop');
  if(s.popup){
    var b='<div class="box"><h1>'+esc(s.popup.t)+'</h1>'+(s.popup.sub?'<p>'+esc(s.popup.sub)+'</p>':'')+(s.popup.notes&&s.popup.notes.length?'<ul class="notes">'+s.popup.notes.map(function(n){return '<li>'+esc(n)+'</li>'}).join('')+'</ul>':'')+'<div class="cols">';
    var ls=s.popup.lists.filter(function(l){return l.i.length});b=b.replace('<div class="cols">','<div class="cols n'+ls.length+'" style="grid-template-columns:repeat('+ls.length+',minmax(0,1fr))">');
    ls.forEach(function(l){b+='<div><h3>'+esc(l.h)+'</h3><ol class="'+(l.i.length>7&&ls.length<=2?'two':'')+'">'+l.i.map(function(x){if(x&&typeof x==='object')return '<li>'+esc(x.n)+(x.s?'<span class="ps">'+esc(x.s)+'</span>':'')+'</li>';var m=/^(.*) \(prize place (\d+)\)$/.exec(String(x));return '<li>'+(m?esc(m[1])+'<span class="pp">Prize place '+m[2]+'</span>':esc(x))+'</li>'}).join('')+'</ol></div>'});
    pop.innerHTML=b+'</div></div>';pop.className='on';
  }else pop.className='';
}
var cardT=null,cardB=null;
function showCard(s){
  playRound();
  var el=$('card'),big,sub,len;
  var lines;
  if(s.phase==='sd'&&s.sdRound===1){lines=[{w:'Sudden',c:'var(--red)'},{w:'Death',c:'var(--w)'}];sub='Board at '+s.angle+'°'}
  else if(s.phase==='sd'){lines=[{w:'Round',c:'var(--red)'},{w:String(s.sdRound),c:'var(--w)'}];sub='Sudden Death, board at '+s.angle+'°'}
  else{lines=[{w:'Round',c:'var(--red)'},{w:String(s.round),c:'var(--w)'}];sub=s.round===s.total?'Final boulder':'Boulder '+s.round+' of '+s.total}
  el.className='';void el.offsetWidth;
  el.innerHTML='<div style="font-size:'+fsize(lines,22,40,true)+'">'+fword(lines,true)+'</div><div class="cs">'+esc(sub)+'</div>';
  el.className='on';
  clearTimeout(cardT);clearTimeout(cardB);
  cardB=setTimeout(function(){el.classList.add('bye')},3000);
  cardT=setTimeout(function(){el.className=''},3600);
}
function mmss(l){return Math.floor(l/60)+':'+String(l%60).padStart(2,'0')}
function setT(el,v){if(el&&el.textContent!==v)el.textContent=v}
function setC(el,v){if(el&&el.className!==v)el.className=v}
function tick(){var o=$('otm');if(o){var l=obs.st==='running'?Math.max(0,Math.ceil((tEnd-Date.now())/1000)):obs.left;setT(o,mmss(l));setC(o,'otm'+(obs.st==='paused'?' paused':obs.st==='running'&&l<=10?' hot':''));setT($('ost'),obs.st==='pending'?'Observation starts soon':obs.st==='paused'?'Observation paused':'Observation time')}
  var el=$('tm');if(!el)return;var t='';if(obs.st==='running'){var l2=Math.ceil((tEnd-Date.now())/1000);if(l2>0)t='Observe '+mmss(l2)}else if(obs.st==='paused')t='Paused '+mmss(obs.left);else if(obs.st==='pending')t='Observe '+mmss(obs.left);setT(el,t);setC(el,'timer'+(obs.st==='running'?'':' idle'))}
(function frame(){tick();requestAnimationFrame(frame)})();
setInterval(tick,500);

render();
if(code)connect();else showConnect();
